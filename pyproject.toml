[project]
name = "docextract"
version = "0.1.0"
description = "Receipt and invoice extraction: OCR+LLM vs small VLM vs fine-tuned VLM, shipped as a service with a review queue"
authors = [{ name = "Vangelis Gkiastas" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic==2.14.4",
    "numpy==2.5.5",
    "scipy==1.18.1",
    "pillow==13.0.0",
    "httpx==0.28.1",
    "pypdfium2==5.15.2",
    "pytesseract==0.3.13",
]

[project.optional-dependencies]
# OCR + VLM inference on the laptop (PyTorch, MPS or CPU)
models = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "transformers==5.24.0",
    "peft==0.22.0",
    "python-doctr==1.1.0",
]
eval = [
    "pyarrow==26.0.1",
    "huggingface-hub>=1.0,<2",
    "zss==1.2.0",
    "matplotlib==3.11.2",
]
service = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.34",
    "gradio==6.32.0",
    "prometheus-client==0.26.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docextract"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks/*.ipynb", "notes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
