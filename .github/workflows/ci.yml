name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
      - run: uv sync --frozen --extra service --extra eval
      - run: uv run ruff check .
      - run: uv run pytest -q
